version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "monthly"
    # No versioning-strategy: for cargo, Dependabot accepts only auto and
    # lockfile-only, and auto updates Cargo.lock, raising a requirement in
    # Cargo.toml only for a release it doesn't allow
    groups:
      cargo:
        patterns:
          - "*"
    cooldown:
      default-days: 7
  - package-ecosystem: "github-actions"
    directory: "/"
    # dist generates release.yml and pins its actions in dist-workspace.toml
    exclude-paths:
      - ".github/workflows/release.yml"
    schedule:
      interval: "monthly"
    groups:
      github-actions:
        patterns:
          - "*"
    cooldown:
      default-days: 7
