version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "monthly"
    # Update Cargo.lock, and raise a requirement in Cargo.toml only for a
    # release it doesn't allow
    versioning-strategy: "increase-if-necessary"
    groups:
      cargo:
        patterns:
          - "*"
    cooldown:
      default-days: 7
  - package-ecosystem: "github-actions"
    directory: "/"
    # dist generates release.yml and pins its actions in dist-workspace.toml
    exclude-paths:
      - ".github/workflows/release.yml"
    schedule:
      interval: "monthly"
    groups:
      github-actions:
        patterns:
          - "*"
    cooldown:
      default-days: 7
