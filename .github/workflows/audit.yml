name: Security audit

on:
  schedule:
    - cron: 0 0 * * 1
  push:
    paths:
      - '**/Cargo.toml'
      - '**/Cargo.lock'
  pull_request:

jobs:
  audit:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Installs a prebuilt cargo-audit from the upstream GitHub releases.
      # `actions-rs/audit-check` built it with `cargo install` instead, which
      # broke once cargo-audit's dependencies outran the runner's toolchain.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit
