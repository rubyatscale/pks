# Starts a release when a push to main changes Cargo.toml's version to one that
# has no tag yet. release.yml (generated by dist, with `dispatch-releases`) does
# the rest: it builds, creates the tag and the GitHub Release, and publishes the
# DotSlash file. A workflow_dispatch is the one event GITHUB_TOKEN can start, so
# this needs no other token.
#
# To release by hand, e.g. to retry after a failed run:
#   gh workflow run release.yml -f tag=v<version>
# To build every artifact without publishing anything:
#   gh workflow run release.yml -f tag=dry-run
name: Auto release

# No concurrency group: GitHub keeps one pending run per group and cancels the
# rest, and a cancelled run says nothing about how to finish the release. The
# check that main hasn't moved already stops overlapping runs from both
# dispatching.
on: # zizmor: ignore[concurrency-limits]
  push:
    branches: [main]
    paths: [Cargo.toml]

permissions: {}

jobs:
  dispatch-release:
    name: Dispatch a release for a new version
    runs-on: ubuntu-24.04
    permissions:
      contents: read # read Cargo.toml and CHANGELOG.md, and look up the tag
      actions: write # `gh workflow run` dispatches release.yml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Dispatch release.yml if this version has no tag yet
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUSHED_SHA: ${{ github.sha }}
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
          tag="v$version"

          if lookup=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" 2>&1); then
            echo "$tag is already tagged, so there's nothing to release."
            exit 0
          elif ! grep -q 'HTTP 404' <<<"$lookup"; then
            echo "::error::Couldn't check for $tag: $lookup"
            exit 1
          fi

          # dist takes the release notes from the CHANGELOG heading that matches
          # the version, so without one the release would have no notes. For a
          # prerelease, dist falls back to the stable version's heading, then to
          # "Unreleased".
          headings=(-e "## $version")
          wanted="'## $version'"
          if [[ $version == *-* ]]; then
            headings+=(-e "## ${version%%-*}" -e "## Unreleased")
            wanted="'## $version', '## ${version%%-*}' or '## Unreleased'"
          fi
          if ! grep -qxF "${headings[@]}" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no $wanted heading. Add one, then run: gh workflow run release.yml -f tag=$tag"
            exit 1
          fi

          # A dispatch runs on the branch's head, so if main has moved on since
          # this push, it would release a later commit. This narrows the window
          # rather than closing it: a dispatch can't pin a SHA, so a commit that
          # lands between this check and the dispatch still ships.
          if ! head=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha); then
            echo "::error::Couldn't look up main's head. Check what's on main, then run: gh workflow run release.yml -f tag=$tag"
            exit 1
          fi
          if [ "$head" != "$PUSHED_SHA" ]; then
            echo "::error::main has moved from $PUSHED_SHA to $head. Check that $head is what should ship as $tag, then run: gh workflow run release.yml -f tag=$tag"
            exit 1
          fi

          gh workflow run release.yml --ref main -f tag="$tag"
          echo "Dispatched release.yml for $tag at $PUSHED_SHA."
