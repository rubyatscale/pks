# https://github.com/actions-rs/example/blob/23ffb1bf0016f41999902ba7542b4f1bb1a89c48/.github/workflows/quickstart.yml#L4
name: CI
on:
  push:
    branches:
      - main
    # See:
    # https://stackoverflow.com/questions/62968897/is-it-possible-to-not-run-github-action-for-readme-updates
    # and
    # https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions#example-excluding-paths
    paths-ignore:
      - '**.md'
  pull_request:
    paths-ignore:
      - '**.md'

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run cargo check
        run: cargo check --locked
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run cargo test with backtrace
        run: cargo test --locked -- --nocapture
        env:
          RUST_BACKTRACE: 1
  lints:
    name: Lints
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: '-Dwarnings'
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run cargo fmt
        run: cargo fmt --all -- --check

      - name: Run cargo clippy
        run: cargo clippy --locked --all-targets --all-features
  build:
    # dist builds releases on these runners, the ones its plan picks for the
    # targets in dist-workspace.toml, but only when releasing. Prism is C, so
    # each needs a C compiler and the libclang that bindgen uses.
    name: Build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-26
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-22.04
          - target: x86_64-pc-windows-msvc
            runner: windows-2022
            # dist links the C runtime statically, so cc builds Prism with /MT
            rustflags: -Ctarget-feature=+crt-static
    runs-on: ${{ matrix.runner }}
    env:
      TARGET: ${{ matrix.target }}
      RUSTFLAGS: ${{ matrix.rustflags }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # As dist does for this target
      - name: Install musl-tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Run cargo build
        shell: bash
        run: |
          rustup toolchain install
          rustup target add "$TARGET"
          cargo build --locked --profile dist --target "$TARGET"

      # Only Test Suite runs Prism otherwise, and only on x86_64 Linux
      - name: Run pks on a fixture
        shell: bash
        run: |
          "target/$TARGET/dist/pks" --project-root tests/fixtures/simple_app \
            --no-cache list-references | grep -F '"constant_name":"::Bar"'
  build-all:
    # The one check for the ruleset to require, since the matrix's names change
    # with its targets. A skipped required check counts as passing, so this runs
    # even when a build fails, and fails then.
    name: Build
    needs: build
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check that every target built
        env:
          RESULT: ${{ needs.build.result }}
        run: test "$RESULT" = success
