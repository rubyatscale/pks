# Adds a DotSlash `pks` file to each GitHub Release. release.yml (generated by
# dist) calls this after the release is published, via `post-announce-jobs` in
# dist-workspace.toml. It can't be a separate `on: release` workflow: dist
# creates the release with GITHUB_TOKEN, and events from GITHUB_TOKEN don't
# trigger other workflows.
name: Publish DotSlash file

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

permissions: {}

jobs:
  publish-dotslash:
    name: Generate and upload the DotSlash file
    runs-on: ubuntu-latest
    permissions:
      contents: write # `gh release upload` adds the DotSlash file to the release
    steps:
      # Reads .github/workflows/dotslash-config.json through the API at the
      # released commit, so there's no checkout.
      - uses: facebook/dotslash-publish-release@9c9ec027515c34db9282a09a25a9cab5880b2c52 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          config: .github/workflows/dotslash-config.json
          tag: ${{ fromJson(inputs.plan).announcement_tag }}
